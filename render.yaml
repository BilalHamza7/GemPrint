services:
  - type: web
    name: gemprint-api
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CV_SERVICE_URL
        sync: false
      - key: CV_INTERNAL_SERVICE_KEY
        sync: false

  - type: web
    name: gemprint-cv-engine
    runtime: python
    region: singapore
    rootDir: cv-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: CV_INTERNAL_SERVICE_KEY
        sync: false
